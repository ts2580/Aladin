<!-- Book Page Lwc -->
<template>
    <div class="slds-theme_shade slds-border_top slds-border_right slds-border_left slds-border_bottom">

        <div class="slds-m-around_medium">
            <lightning-card icon-name="standard:knowledge" title="권별">
            </lightning-card>
            <p class="slds-truncate">
                Sorted by 권(숫자)
            </p>
        </div>

        <div class="slds-border_top">
            <c-salesforce-codex-data-table
                    key-field="Id"
                    data={books.data}
                    columns={bookColumns}
                    onsave={handleSave}
                    draft-values={draftValues}
            >
            </c-salesforce-codex-data-table>
        </div>
    </div>

</template>
