<template>
    <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open slds-modal_large">
        <div class="slds-modal__container">
            <!-- Close Icon -->
            <div class="slds-text-align_right slds-m-bottom_small">
                <lightning-icon class="closeIcon"
                                icon-name="utility:close"
                                alternative-text="Back to page"
                                title="close"
                                onclick={fnClose}
                ></lightning-icon>
            </div>
            <!-- Header -->
            <header class="slds-modal__header">
                <h1 class="slds-modal__title slds-hyphenate">계정 삽입</h1>
            </header>
            <!-- Body -->
            <div class="slds-modal__content slds-p-around_medium" style="height: 40rem">
                <lightning-button class="slds-m-top_small slds-m-bottom_small slds-float_right"
                                  label="제거"
                                  variant="destructive-text"
                                  onclick={fnDeleteRow}>
                </lightning-button>
                <lightning-button class="slds-m-top_small slds-m-bottom_small slds-float_right slds-m-right_small"
                                  variant="brand"
                                  label="추가"
                                  onclick={fnAddRow}
                ></lightning-button>
                <lightning-record-edit-form object-api-name="temp_quota_distribution__c">
                    <table id="data-table">
                        <thead>
                        <tr>
                            <th>기업명</th>
                            <th>기업번호</th>
                            <th>전화번호</th>
                            <th>사원 총수</th>
                            <th>등기일</th>
                        </tr>
                        </thead>
                        <tbody>
                        <template for:each={mainArray} for:item="item" for:index="idx">
                            <tr key={item.Id}>
                                <td>
                                    <input
                                            type="text"
                                            data-key="Name"
                                            data-index={idx}
                                            value={item.Name}
                                            onpaste={handlePaste}
                                    />
                                </td>
                                <td>
                                    <input
                                            type="text"
                                            data-key="AccountNumber"
                                            data-index={idx}
                                            value={item.AccountNumber}
                                            onpaste={handlePaste}
                                    />
                                </td>
                                <td>
                                    <input
                                            type="text"
                                            data-key="Phone"
                                            data-index={idx}
                                            value={item.Phone}
                                            onpaste={handlePaste}
                                    />
                                </td>
                                <td>
                                    <input
                                            type="number"
                                            data-key="NumberOfEmployees"
                                            data-index={idx}
                                            value={item.NumberOfEmployees}
                                            onpaste={handlePaste}
                                    />
                                </td>
                                <td>
                                    <input
                                            type="text"
                                            data-key="RegistrationDate__c"
                                            data-index={idx}
                                            value={item.RegistrationDate__c}
                                            onpaste={handlePaste}
                                    />
                                </td>
                            </tr>
                        </template>
                        </tbody>
                    </table>
                </lightning-record-edit-form>
            </div>
            <!-- Footer -->
            <footer class="slds-modal__footer">
                <lightning-button class="slds-m-top_small slds-m-bottom_small slds-float_right"
                                  variant="brand"
                                  label="저장"
                                  onclick= {fnSave}
                ></lightning-button>
                <lightning-button class="slds-m-top_small slds-m-bottom_small slds-float_right slds-m-right_x-small"
                                  label="취소"
                                  onclick={fnClose}
                ></lightning-button>
            </footer>
        </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open" style="z-index:8998" role="presentation"></div>
</template>
