<!-- Book By Branch -->
<template>
    <div class="slds-theme_shade slds-border_top slds-border_right slds-border_left slds-border_bottom">

        <div class="slds-m-around_medium">
            <lightning-card icon-name="standard:knowledge" title="지점별 책 재고">
            </lightning-card>
            <p class="slds-truncate">
                Sorted by 제목
            </p>
        </div>

        <div class="slds-border_top">
            <lightning-datatable
                    key-field="Id"
                    data={books}
                    columns={bookColumns}
            >
            </lightning-datatable>
        </div>

    </div>

</template>
