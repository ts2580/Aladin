<!-- Book Page Lwc -->
<template>
    <div class="slds-theme_shade slds-border_top slds-border_right slds-border_left slds-border_bottom">

        <div class="slds-m-around_medium">
            <lightning-card icon-name="standard:knowledge" title="권별">
            </lightning-card>
            <p class="slds-truncate">
                Sorted by 권(숫자)
            </p>
        </div>

        <div class="slds-border_top">
            <c-salesforce-codex-data-table
                    key-field="Id"
                    data={books.data}
                    columns={bookColumns}
                    onsave={handleSave}
                    draft-values={draftValues}>
            </c-salesforce-codex-data-table>
        </div>

    </div>

    <div class="slds-form-element">
        <label class="slds-form-element__label" for="text-input-id-49">Input Label</label>
        <div class="slds-form-element__control slds-input-has-icon slds-input-has-icon_right">
            <svg class="slds-icon slds-input__icon slds-input__icon_right slds-icon-text-default" aria-hidden="true">
                <use xlink:href="/assets/icons/utility-sprite/svg/symbols.svg#search"></use>
            </svg>
            <input type="text" id="text-input-id-49" placeholder="Placeholder text…" class="slds-input" />
        </div>
    </div>






</template>
